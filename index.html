const tz="Europe/Belgrade", iso=d=>d.toLocaleDateString("sv",{timeZone:tz});
const today=iso(new Date()), addDays=(s,n)=>{const d=new Date(s+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const tomorrow=addDays(today,1), weekEnd=addDays(today,7);
const fmt=(s,o)=>new Date(s+"T12:00:00Z").toLocaleDateString("ru-RU",{timeZone:"UTC",...o});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ev=DATA.events.map(e=>({...e,eff:(e.date<today&&e.end&&e.end>=today)?today:e.date,
  tags:(e.tags||[]).filter(t=>LABELS[t])})).filter(e=>e.eff>=today);
const st={range:"week",cat:"all",q:""};
try{const h=new URLSearchParams(location.hash.slice(1));
  if(["today","tomorrow","week","all"].includes(h.get("r")))st.range=h.get("r");if(h.get("c"))st.cat=h.get("c")}catch(_){}
function match(e){
  if(st.range==="today"&&e.eff!==today)return false;
  if(st.range==="tomorrow"&&e.eff!==tomorrow)return false;
  if(st.range==="week"&&e.eff>weekEnd)return false;
  if(st.cat!=="all"&&!e.tags.includes(st.cat))return false;
  if(st.q){const h=(e.title+" "+e.summary+" "+e.loc+" "+e.chat).toLowerCase();if(!h.includes(st.q))return false}
  return true}
function renderCats(){
  const base=ev.filter(e=>{const c=st.cat;st.cat="all";const m=match(e);st.cat=c;return m});
  const n={};base.forEach(e=>e.tags.forEach(t=>n[t]=(n[t]||0)+1));
  const keys=Object.keys(n).sort((a,b)=>n[b]-n[a]);
  cats.innerHTML=`<button class="pill" data-v="all" aria-pressed="${st.cat==="all"}">Все<small>${base.length}</small></button>`+
    keys.map(k=>`<button class="pill" data-v="${k}" aria-pressed="${st.cat===k}">${LABELS[k]}<small>${n[k]}</small></button>`).join("")}
function render(){
  document.querySelectorAll("#range button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.range));
  renderCats();
  const rows=ev.filter(match);
  if(!rows.length){list.innerHTML='<div class="empty">Ничего не найдено</div>';return}
  let out="",cur="";
  for(const e of rows){
    if(e.eff!==cur){cur=e.eff;
      const rel=cur===today?"Сегодня":cur===tomorrow?"Завтра":fmt(cur,{weekday:"long"});
      out+=`<h2 class="day">${esc(rel[0].toUpperCase()+rel.slice(1))}<span>${fmt(cur,{day:"numeric",month:"long"})}</span></h2>`}
    out+=`<article class="card"><div class="time ${e.time?"":"none"}">${e.time||"весь день"}</div><div>
      <h3 class="title">${esc(e.title)}</h3>${e.summary?`<p class="desc">${esc(e.summary)}</p>`:""}
      <div class="meta">${e.tags.map(t=>`<span class="tag">${LABELS[t]}</span>`).join("")}
      ${e.loc?`<span class="loc">${esc(e.loc)}</span>`:""}
      ${e.url?`<a class="src" href="${esc(e.url)}" target="_blank" rel="noopener">Источник ↗</a>`:""}</div></div></article>`}
  list.innerHTML=out}
document.getElementById("range").onclick=e=>{const b=e.target.closest("button");if(b){st.range=b.dataset.v;sync();render()}};
cats.onclick=e=>{const b=e.target.closest("button");if(b){st.cat=b.dataset.v;sync();render()}};
q.oninput=()=>{st.q=q.value.trim().toLowerCase();render()};
list.onclick=e=>{if(e.target.closest("a"))return;const c=e.target.closest(".card");if(c)c.classList.toggle("open")};
